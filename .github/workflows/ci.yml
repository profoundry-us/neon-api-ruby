name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each Ruby uses its own committed lockfile (gemfiles/ruby_<ver>.gemfile),
      # resolved under that Ruby, so one machine-generated lock doesn't pin
      # transitive deps that dropped older Rubies. Regenerate with `rake matrix:lock`.
      matrix:
        include:
          - { ruby: "3.0", gemfile: gemfiles/ruby_3.0.gemfile }
          - { ruby: "3.1", gemfile: gemfiles/ruby_3.1.gemfile }
          - { ruby: "3.2", gemfile: gemfiles/ruby_3.2.gemfile }
          - { ruby: "3.3", gemfile: gemfiles/ruby_3.3.gemfile }
    name: Ruby ${{ matrix.ruby }}
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v4
      # rbnacl binds to libsodium at runtime; needed so the EdDSA verification
      # spec (the issue #1 regression guard) runs rather than skips.
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rspec --exclude-pattern "spec/rails/**/*_spec.rb"

  # The Rails integration specs (Combustion) run in isolated bundles so the
  # matrix above stays Rails-free; a modern Ruby exercises the glue across Rails
  # majors.
  rails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gemfile:
          - gemfiles/rails_7.1.gemfile
          - gemfiles/rails_8.0.gemfile
    name: Rails (${{ matrix.gemfile }})
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run Rails integration specs
        run: bundle exec rspec spec/rails

  lint:
    runs-on: ubuntu-latest
    name: RuboCop
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop
