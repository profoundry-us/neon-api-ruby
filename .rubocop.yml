plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "pkg/**/*"
    # Generator templates are example code for the *generated* app (and contain
    # ERB), not gem source — they should not be linted as Ruby.
    - "lib/generators/**/templates/**/*"
    # Machine-generated from the Neon OpenAPI spec (rake types:generate); its
    # size and shape follow the spec, not our style rules.
    - "lib/neon_api/types.rb"

# This is a documentation- and example-heavy library; long descriptive blocks
# and the breadth of the API surface make a few of the default metrics noisy
# without improving the code.
Metrics/MethodLength:
  Max: 30
Metrics/AbcSize:
  Max: 30
Metrics/ClassLength:
  Max: 250
  # Literal data blocks (config hashes, code-template heredocs) read as one
  # unit; counting each line penalizes declarative code.
  CountAsOne: ["array", "hash", "heredoc"]
Metrics/ParameterLists:
  Max: 6
  CountKeywordArgs: false
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Style/Documentation:
  Enabled: false

# We intentionally declare development dependencies in the gemspec so the gem is
# self-describing; they are mirrored in the Gemfile for convenience.
Gemspec/DevelopmentDependencies:
  Enabled: false

# Our file names keep natural acronym casing (oauth_providers, omniauth) rather
# than RuboCop's preferred o_auth_providers / omni_auth.
RSpec/SpecFilePathFormat:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Layout/LineLength:
  Max: 110
  Exclude:
    - "spec/**/*"

RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Max: 8
RSpec/NestedGroups:
  Max: 5
RSpec/MultipleMemoizedHelpers:
  Max: 10

# The live integration spec describes an end-to-end flow (not a class) and needs
# before/after(:all) to toggle WebMock's net-connect block once for the group.
RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"
RSpec/BeforeAfterAll:
  Exclude:
    - "spec/integration/**/*"
