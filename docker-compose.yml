services:

  # The gem development container. It builds the dependencies into the image
  # and mounts the working tree on top, so host edits are live inside the
  # container. The container just stays alive (tini + tail) and we exec into
  # it for tests, lint, and a console — see the justfile.
  gem:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount the whole repo so code changes are reflected immediately. The
      # bundle lives at /usr/local/bundle (outside /app), so it is not shadowed
      # by this mount; dependencies are baked in at build time. After changing
      # the Gemfile/gemspec, `just rebuild` to reinstall.
      - .:/app
    tty: true
    stdin_open: true
